services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-observable-llmtap:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:7878:17878"
      - "127.0.0.1:7879:17879"
    volumes:
      - llmtap-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7879/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.0.1}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: frser-sqlite-datasource 4.0.6
    volumes:
      - llmtap-data:/var/lib/llmtap:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  llmtap-data:
