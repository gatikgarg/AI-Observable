<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" width="100%" height="100%">
  <defs>
    <!-- Metallic Yellow to Red Gradient -->
    <linearGradient id="metallicBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Linear Gradient specifically for the text to match the binocular's metallic color flow -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>

    <!-- Clip Paths to trim eyelids and pupils within the circular lens boundaries -->
    <clipPath id="leftLensClip">
      <circle cx="160" cy="220" r="48" />
    </clipPath>
    <clipPath id="rightLensClip">
      <circle cx="340" cy="220" r="48" />
    </clipPath>
  </defs>

  <!-- Binoculars Structure -->
  <g filter="url(#dropShadow)">
    <!-- Center Bridge -->
    <path d="M 210 165 L 290 165 L 280 235 L 220 235 Z" fill="url(#metallicBodyGrad)" />

    <!-- Left Barrel -->
    <rect x="110" y="120" width="100" height="200" rx="38" fill="url(#metallicBodyGrad)" />
    <!-- Right Barrel -->
    <rect x="290" y="120" width="100" height="200" rx="38" fill="url(#metallicBodyGrad)" />

    <!-- Grip Accent Bands -->
    <rect x="116" y="195" width="88" height="20" rx="6" fill="url(#accentGrad)" opacity="0.95" />
    <rect x="296" y="195" width="88" height="20" rx="6" fill="url(#accentGrad)" opacity="0.95" />

    <!-- Outer Lens Rings -->
    <circle cx="160" cy="220" r="52" fill="url(#lensGrad)" stroke="#fef08a" stroke-width="5" />
    <circle cx="340" cy="220" r="52" fill="url(#lensGrad)" stroke="#fef08a" stroke-width="5" />
  </g>

  <!-- LEFT EYE (Inside Left Lens) -->
  <g clip-path="url(#leftLensClip)">
    <!-- Light Purple Eyelid Tone Top & Bottom -->
    <rect x="110" y="170" width="100" height="100" fill="#d8b4fe" />

    <!-- Middle Eye Sclera (White Band with Black Outline Borders) -->
    <rect x="110" y="198" width="100" height="44" fill="#ffffff" stroke="#000000" stroke-width="3" />

    <!-- Left Pupil: Side-glancing D-shape touching right edge -->
    <path d="M 183 198 A 12 22 0 0 1 183 242 Z" fill="#000000" />
  </g>

  <!-- RIGHT EYE (Inside Right Lens) -->
  <g clip-path="url(#rightLensClip)">
    <!-- Light Purple Eyelid Tone Top & Bottom -->
    <rect x="290" y="170" width="100" height="100" fill="#d8b4fe" />

    <!-- Middle Eye Sclera (White Band with Black Outline Borders) -->
    <rect x="290" y="198" width="100" height="44" fill="#ffffff" stroke="#000000" stroke-width="3" />

    <!-- Right Pupil: Side-glancing D-shape touching right edge -->
    <path d="M 363 198 A 12 22 0 0 1 363 242 Z" fill="#000000" />
  </g>

  <!-- Eyebrows moved outside the lenses at the exact same vertical height -->
  <!-- Left Eyebrow: Arched & Curved -->
  <path d="M 120 178 Q 155 145 198 178 Q 155 158 120 178 Z" fill="#000000" />

  <!-- Right Eyebrow: Flat Suspicious Bar -->
  <path d="M 302 174 Q 340 168 378 175 Q 340 174 302 174 Z" fill="#000000" stroke="#000000" stroke-width="6" stroke-linecap="round" />

  <!-- Company Text Below Logo filled with the binocular's metallic gradient and no boundary/stroke -->
  <text x="250" y="385" font-family="&#39;ITC Avant Garde Gothic Std&#39;, &#39;Avant Garde&#39;, Futura, &#39;Century Gothic&#39;, sans-serif" font-size="52" font-weight="700" fill="url(#textGradient)" text-anchor="middle" letter-spacing="1.5">AI - Observable</text>
</svg>
